# ============================================================
# facilitatorx402 — docker-compose (local dev + CI)
# Services: app, postgres, redis
# ============================================================
version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: facilitatorx402
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/facilitatorx402
      REDIS_URL: redis://redis:6379
      FACILITATOR_PRIVATE_KEY: ${FACILITATOR_PRIVATE_KEY}
      RPC_URL: ${RPC_URL}
      RPC_URL_FALLBACK: ${RPC_URL_FALLBACK:-""}
      MIN_CONFIRMATIONS: ${MIN_CONFIRMATIONS:-2}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-50}
      DEVELOPER_SHARE_BPS: ${DEVELOPER_SHARE_BPS:-20}
      PORT: 3000
      HOST: 0.0.0.0
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      METRICS_TOKEN: ${METRICS_TOKEN:-""}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
