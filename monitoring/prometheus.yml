# Prometheus scrape config — facilitatorx402
# Scrap les métriques de l'API toutes les 15s.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: facilitatorx402

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: facilitatorx402
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: /metrics
    # Si METRICS_TOKEN est configuré :
    # bearer_token: <votre_token>

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
